name: Windows

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_TYPE: RelWithDebInfo

jobs:
  build:
    runs-on: windows-2022
    outputs:
      version: ${{ steps.version.outputs.version }}

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check release version
        id: version
        run: |
          $cmakeContents = Get-Content CMakeLists.txt -Raw
          $match = [regex]::Match(
            $cmakeContents,
            '(?s)project\s*\(\s*AirPodsDesktop\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)'
          )
          if (-not $match.Success) {
            throw 'Unable to read the project version from CMakeLists.txt.'
          }

          $version = $match.Groups[1].Value
          $manifestVersion = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'version-string'
          if ($version -ne $manifestVersion) {
            throw "CMake version $version does not match vcpkg version $manifestVersion."
          }

          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match application version v$version."
          }

          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Clone Qt dependencies
        run: |
          git clone --depth 1 --recursive `
            https://github.com/SpriteOvO/AirPodsDesktop-Deps.git `
            Build/AirPodsDesktop-Deps

      - name: Clone and bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git Build/vcpkg
          & Build/vcpkg/bootstrap-vcpkg.bat -disableMetrics

      - name: Configure
        run: |
          cmake -S . -B Build/Release `
            -G 'Visual Studio 17 2022' `
            -A Win32 `
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/Build/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/Build/AirPodsDesktop-Deps/Qt/5.15.2/msvc2019 `
            -DAPD_BUILD_TESTS=ON `
            -DAPD_GENERATE_INSTALLER=ON `
            -DAPD_BUILD_GIT_HASH=${{ github.sha }}

      - name: Build
        run: cmake --build Build/Release --config $env:BUILD_TYPE --parallel 2

      - name: Test
        run: ctest --test-dir Build/Release -C $env:BUILD_TYPE --output-on-failure

      - name: Package release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $installer = Get-ChildItem `
            Build/Release/Installer/AirPodsDesktop-*-win32.exe |
            Select-Object -First 1
          if (-not $installer) {
            throw 'The NSIS installer was not generated.'
          }

          $portableSource =
            "Build/Release/Installer/_CPack_Packages/win32/NSIS/AirPodsDesktop-$env:VERSION-win32/AirPodsDesktop"
          if (-not (Test-Path -LiteralPath $portableSource)) {
            throw "Portable package directory not found: $portableSource"
          }

          New-Item -ItemType Directory -Path dist | Out-Null
          $installerDestination = "dist/AirPodsDesktop-$env:VERSION-win32.exe"
          $portableDestination = "dist/AirPodsDesktop-$env:VERSION-win32-portable.zip"
          Copy-Item -LiteralPath $installer.FullName -Destination $installerDestination
          Compress-Archive -Path "$portableSource/*" -DestinationPath $portableDestination

          Get-ChildItem dist -File |
            Where-Object Extension -In '.exe', '.zip' |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            } | Set-Content dist/SHA256SUMS.txt -Encoding ascii

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AirPodsDesktop-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: AirPodsDesktop-${{ needs.build.outputs.version }}-${{ github.sha }}
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}" dist/*
          --repo "${{ github.repository }}"
          --verify-tag
          --generate-notes
          --title "AirPodsDesktop ${{ github.ref_name }}"
