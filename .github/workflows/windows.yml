name: Windows

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_TYPE: RelWithDebInfo

jobs:
  build:
    runs-on: windows-2022
    outputs:
      version: ${{ steps.version.outputs.version }}

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Check release version
        id: version
        run: |
          $cmakeContents = Get-Content CMakeLists.txt -Raw
          $match = [regex]::Match(
            $cmakeContents,
            '(?s)project\s*\(\s*AirPodsDesktop\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)'
          )
          if (-not $match.Success) {
            throw 'Unable to read the project version from CMakeLists.txt.'
          }

          $version = $match.Groups[1].Value
          $manifestVersion = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'version-string'
          if ($version -ne $manifestVersion) {
            throw "CMake version $version does not match vcpkg version $manifestVersion."
          }

          # Accept both tag conventions: releases before v0.5.0 are tagged without the `v`.
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and
              $env:GITHUB_REF_NAME -ne "v$version" -and $env:GITHUB_REF_NAME -ne $version) {
            throw "Tag $env:GITHUB_REF_NAME matches neither v$version nor $version."
          }

          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true

      - name: Clone and bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git Build/vcpkg
          & Build/vcpkg/bootstrap-vcpkg.bat -disableMetrics

      - name: Configure
        run: |
          cmake -S . -B Build/Release `
            -G 'Visual Studio 17 2022' `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/Build/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR `
            -DAPD_BUILD_TESTS=ON `
            -DAPD_GENERATE_INSTALLER=ON `
            -DAPD_GITHUB_OWNER=${{ github.repository_owner }} `
            -DAPD_GITHUB_REPOSITORY=${{ github.event.repository.name }} `
            -DAPD_BUILD_GIT_HASH=${{ github.sha }}

      - name: Build
        run: cmake --build Build/Release --config $env:BUILD_TYPE --parallel 2

      - name: Test
        run: |
          $uiLog = Join-Path $env:RUNNER_TEMP 'UiRenderingTests.txt'
          & Build/Release/Binary/UiRenderingTests.exe -o "$uiLog,txt"
          $uiExitCode = $LASTEXITCODE
          if ($uiExitCode -ne 0) {
            Get-Content -LiteralPath $uiLog
            throw "UiRenderingTests failed with exit code $uiExitCode."
          }
          ctest --test-dir Build/Release -C $env:BUILD_TYPE `
            --exclude-regex '^UiRenderingTests$' `
            --output-on-failure

      - name: Package release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $installer = Get-ChildItem `
            Build/Release/Installer/AirPodsDesktop-*-win64.exe |
            Select-Object -First 1
          if (-not $installer) {
            throw 'The NSIS installer was not generated.'
          }

          $portableSource =
            "Build/Release/Installer/_CPack_Packages/win64/NSIS/AirPodsDesktop-$env:VERSION-win64/AirPodsDesktop"
          if (-not (Test-Path -LiteralPath $portableSource)) {
            throw "Portable package directory not found: $portableSource"
          }
          $requiredRuntimeFiles = @(
            'AirPodsDesktop.exe',
            'Qt6Core.dll',
            'platforms/qwindows.dll',
            'iconengines/qsvgicon.dll',
            'imageformats/qsvg.dll',
            'multimedia/ffmpegmediaplugin.dll'
          )
          foreach ($relativePath in $requiredRuntimeFiles) {
            if (-not (Test-Path -LiteralPath (Join-Path $portableSource $relativePath))) {
              throw "Required deployed runtime is missing: $relativePath"
            }
          }
          $forbiddenPackagePattern =
            '(?i)((^|[\\/])[^\\/]*(test|mock|simulat(?:or|ion)|fixture|harness|validation)[^\\/]*($|[\\/])|(^|[\\/])[^\\/]+\.(pdb|ilk|lib|exp)$)'
          $forbiddenPackageEntries = Get-ChildItem -LiteralPath $portableSource -Recurse -Force |
            ForEach-Object {
              [IO.Path]::GetRelativePath($portableSource, $_.FullName)
            } |
            Where-Object { $_ -match $forbiddenPackagePattern }
          if ($forbiddenPackageEntries) {
            throw "Production package contains forbidden test or simulation artifacts: $($forbiddenPackageEntries -join ', ')"
          }

          $dumpbin = Get-ChildItem `
            "${env:ProgramFiles}/Microsoft Visual Studio/2022/*/VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $dumpbin) {
            throw 'dumpbin.exe was not found on the runner.'
          }
          $applicationHeaders = & $dumpbin.FullName /headers (Join-Path $portableSource 'AirPodsDesktop.exe')
          $installerHeaders = & $dumpbin.FullName /headers $installer.FullName
          if (($applicationHeaders -join "`n") -notmatch 'machine \(x64\)') {
            throw 'The packaged application is not x64.'
          }
          if (($installerHeaders -join "`n") -notmatch 'machine \(x86\)') {
            throw 'The NSIS compatibility bootstrap is not Win32-launchable.'
          }

          New-Item -ItemType Directory -Path dist | Out-Null
          $installerDestination = "dist/AirPodsDesktop-$env:VERSION-win64.exe"
          $portableDestination = "dist/AirPodsDesktop-$env:VERSION-win64-portable.zip"
          Copy-Item -LiteralPath $installer.FullName -Destination $installerDestination
          Compress-Archive -Path "$portableSource/*" -DestinationPath $portableDestination

      - name: Sign release installer when configured
        id: signing
        if: github.ref_type == 'tag'
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_PASSWORD)
          if ($hasCertificate -ne $hasPassword) {
            throw 'Configure both Windows code-signing secrets or leave both unset.'
          }
          if (-not $hasCertificate) {
            Write-Warning 'Code-signing secrets are not configured; the draft release will contain unsigned installers.'
            "signed=false" >> $env:GITHUB_OUTPUT
            return
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP 'AirPodsDesktop-signing.pfx'
          try {
            [IO.File]::WriteAllBytes(
              $certificatePath,
              [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64)
            )
            $signTool = Get-ChildItem `
              "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x86/signtool.exe" |
              Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
              Select-Object -First 1
            if (-not $signTool) {
              throw 'signtool.exe was not found on the runner.'
            }

            $installer = Get-ChildItem dist/AirPodsDesktop-*-win64.exe | Select-Object -First 1
            & $signTool.FullName sign `
              /fd SHA256 `
              /td SHA256 `
              /tr http://timestamp.digicert.com `
              /f $certificatePath `
              /p $env:SIGNING_CERTIFICATE_PASSWORD `
              $installer.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "signtool sign failed with exit code $LASTEXITCODE."
            }

            & $signTool.FullName verify /pa /v $installer.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "signtool verify failed with exit code $LASTEXITCODE."
            }
            "signed=true" >> $env:GITHUB_OUTPUT
          }
          finally {
            Remove-Item -LiteralPath $certificatePath -Force -ErrorAction SilentlyContinue
          }

      - name: Create Win32 update bridge
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $source = "dist/AirPodsDesktop-$env:VERSION-win64.exe"
          $bridge = "dist/AirPodsDesktop-$env:VERSION-win32-bridge.exe"
          if (-not (Test-Path -LiteralPath $source)) {
            throw "Signed x64 installer not found: $source"
          }
          Copy-Item -LiteralPath $source -Destination $bridge
          $sourceHash = (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash
          $bridgeHash = (Get-FileHash -LiteralPath $bridge -Algorithm SHA256).Hash
          if ($sourceHash -ne $bridgeHash) {
            throw 'The Win32 bridge does not contain the signed x64 installer byte-for-byte.'
          }

      - name: Verify release installer signatures
        if: github.ref_type == 'tag' && steps.signing.outputs.signed == 'true'
        run: |
          $signTool = Get-ChildItem `
            "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x86/signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1
          if (-not $signTool) {
            throw 'signtool.exe was not found on the runner.'
          }
          Get-ChildItem dist/AirPodsDesktop-*.exe | ForEach-Object {
            & $signTool.FullName verify /pa /v $_.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Authenticode verification failed for $($_.Name)."
            }
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: AirPodsDesktop-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v5
        with:
          name: AirPodsDesktop-${{ needs.build.outputs.version }}-${{ github.sha }}
          path: dist

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          "dist/AirPodsDesktop-${{ needs.build.outputs.version }}-win64.exe"
          "dist/AirPodsDesktop-${{ needs.build.outputs.version }}-win64-portable.zip"
          "dist/AirPodsDesktop-${{ needs.build.outputs.version }}-win32-bridge.exe"
          --repo "${{ github.repository }}"
          --draft
          --verify-tag
          --generate-notes
          --title "AirPodsDesktop ${{ github.ref_name }}"
